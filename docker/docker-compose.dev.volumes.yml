# Override for mounting local sources to container
# Keep node_modules from the image; only mount files used during development.
services:
  proxy:
    volumes:
      - ../gui:/usr/share/nginx/html/
  weather:
    volumes:
      - ../src:/weather-aprs/src
      - ../index.js:/weather-aprs/index.js
      - ../.env:/weather-aprs/.env
  
